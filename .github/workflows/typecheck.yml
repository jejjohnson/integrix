name: Type Check

on:
  push:
    branches: [main]
  # Every PR, whatever its base, so a stacked PR is checked too.
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install typecheck dependencies
        run: uv sync --group typecheck
      - name: Run ty check
        run: uv run --group typecheck ty check src/integrix scripts
